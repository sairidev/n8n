name: Docker

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -e

          TAG_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] && TAG_ARGS+=(--tag "$line")
          done <<< "$TAGS"

          LABEL_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] && LABEL_ARGS+=(--label "$line")
          done <<< "$LABELS"

          # docker.n8n.io (the base image registry) throttles GitHub Actions'
          # shared runner IPs with 429 Too Many Requests. This is almost
          # always transient, so retry the build with backoff instead of
          # failing the whole job on the first hit.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Build attempt ${attempt}/${MAX_ATTEMPTS}"
            if docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file Dockerfile \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              "${TAG_ARGS[@]}" \
              "${LABEL_ARGS[@]}" \
              --push .; then
              echo "::endgroup::"
              echo "Build succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              WAIT=$((attempt * 20))
              echo "Build failed (possible registry rate limit). Retrying in ${WAIT}s..."
              sleep "$WAIT"
            fi
          done
          echo "Build failed after ${MAX_ATTEMPTS} attempts"
          exit 1
