name: Docker

# Build image n8n-pterodactyl lalu push ke ghcr.io/<pemilik>/n8n, kemudian uji jalan
# seperti Pterodactyl Wings (user non-root, volume /home/container, STARTUP, SERVER_PORT).
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'Versi n8n (tag Docker Hub n8nio/n8n, mis. stable, latest, 2.44.3)'
        default: 'stable'

env:
  REGISTRY: ghcr.io
  N8N_VERSION: ${{ github.event.inputs.n8n_version || 'stable' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      # Semua node panel amd64. Base dari Docker Hub (n8nio/n8n), bukan docker.n8n.io
      # yang membatasi runner GitHub (429). Percobaan ulang tetap ada untuk jaga-jaga.
      - name: Build and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -e
          TAG_ARGS=(); while IFS= read -r l; do [ -n "$l" ] && TAG_ARGS+=(--tag "$l"); done <<< "$TAGS"
          LABEL_ARGS=(); while IFS= read -r l; do [ -n "$l" ] && LABEL_ARGS+=(--label "$l"); done <<< "$LABELS"
          for attempt in 1 2 3; do
            if docker buildx build --platform linux/amd64 \
                 --build-arg N8N_VERSION="${N8N_VERSION}" \
                 --cache-from type=gha --cache-to type=gha,mode=max \
                 "${TAG_ARGS[@]}" "${LABEL_ARGS[@]}" --push .; then
              exit 0
            fi
            echo "Build gagal, coba lagi dalam $((attempt * 20)) detik..."; sleep $((attempt * 20))
          done
          exit 1

      - name: Uji jalan seperti Wings
        run: |
          IMAGE="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA::7}"
          docker pull -q "$IMAGE"
          mkdir -p data && sudo chown 988:988 data
          docker run -d --name n8n-uji --user 988:988 \
            -v "$PWD/data:/home/container" \
            -e STARTUP='n8n start' -e SERVER_PORT=8123 -e SERVER_IP=127.0.0.1 -e SERVER_MEMORY=1024 \
            -e GENERIC_TIMEZONE=Asia/Jakarta -e N8N_SECURE_COOKIE=false \
            -p 8123:8123 "$IMAGE"
          # Tunggu teks "done" egg (status Running di panel), bukan sekadar /healthz:
          # /healthz sudah menjawab saat migrasi database masih berjalan.
          ready=0
          for i in $(seq 1 100); do
            if docker logs n8n-uji 2>&1 | grep -q 'Editor is now accessible via'; then ready=1; break; fi
            sleep 3
          done
          echo "::group::Log awal (banner)"; docker logs n8n-uji 2>&1 | head -16; echo "::endgroup::"
          echo "done-string: $ready"
          echo "healthz: $(curl -s http://127.0.0.1:8123/healthz)"
          echo "halaman editor: HTTP $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/)"
          docker stop -t 30 n8n-uji >/dev/null
          code=$(docker inspect n8n-uji --format '{{.State.ExitCode}}')
          echo "::group::Log akhir"; docker logs n8n-uji 2>&1 | tail -15; echo "::endgroup::"
          echo "exit setelah stop: $code"
          echo "isi data:"; sudo ls -la data/.n8n | head -20
          [ "$ready" = 1 ] || { echo "n8n tidak sampai 'Editor is now accessible'"; exit 1; }
          sudo test -f data/.n8n/database.sqlite || { echo "database tidak di /home/container/.n8n"; exit 1; }
          sudo test ! -e data/.n8n/.n8n || { echo "folder data bertingkat (.n8n/.n8n)"; exit 1; }
          [ "$code" = 0 ] || { echo "n8n tidak berhenti dengan bersih (exit $code)"; exit 1; }
          docker logs n8n-uji 2>&1 | grep -q 'URL publik' || { echo "banner bahasa Indonesia tidak muncul"; exit 1; }
          if docker logs n8n-uji 2>&1 | grep -E -- '- (N8N_RUNNERS_ENABLED|WEBHOOK_URL|N8N_UNVERIFIED_PACKAGES_ENABLED|N8N_RUNNERS_TASK_TIMEOUT|N8N_COMPRESSION_NODE_[A-Z_]+) ->'; then
            echo "masih ada peringatan usang dari variabel yang diatur image"; exit 1
          fi

      - name: Uji URL publik (N8N_WEBHOOK_URL)
        run: |
          IMAGE="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA::7}"
          out=$(docker run --rm -e WEBHOOK_URL=https://n8n.contoh.id -e SERVER_PORT=8125 "$IMAGE" sh -c 'echo "N8N_WEBHOOK_URL=$N8N_WEBHOOK_URL WEBHOOK_URL=${WEBHOOK_URL:-kosong} HOST=$N8N_HOST PROTO=$N8N_PROTOCOL"' 2>&1)
          echo "$out"
          echo "$out" | grep -q 'N8N_WEBHOOK_URL=https://n8n.contoh.id/ WEBHOOK_URL=kosong HOST=n8n.contoh.id PROTO=https' || { echo "pemetaan URL publik salah"; exit 1; }
          # Alokasi 0.0.0.0 tanpa URL publik -> N8N_HOST = IP publik, bukan localhost
          out=$(docker run --rm -e SERVER_IP=0.0.0.0 -e SERVER_PORT=8126 "$IMAGE" sh -c 'echo "HOST=$N8N_HOST"' 2>&1)
          echo "$out"
          echo "$out" | grep -Eq 'HOST=[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' || { echo "IP publik tidak terdeteksi"; exit 1; }
          echo "$out" | grep -q 'URL publik.* : http://[0-9]' || { echo "banner masih localhost"; exit 1; }

      - name: Uji HTTPS otomatis (Cloudflare Tunnel)
        run: |
          IMAGE="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA::7}"
          mkdir -p data2 && sudo chown 988:988 data2
          docker run -d --name n8n-tunnel --user 988:988 -v "$PWD/data2:/home/container" \
            -e STARTUP='n8n start' -e SERVER_PORT=8127 -e SERVER_IP=0.0.0.0 -e SERVER_MEMORY=1024 \
            -e HTTPS_TUNNEL=1 -e N8N_SECURE_COOKIE=false "$IMAGE"
          ready=0
          for i in $(seq 1 100); do
            if docker logs n8n-tunnel 2>&1 | grep -q 'Editor is now accessible via'; then ready=1; break; fi
            sleep 3
          done
          docker logs n8n-tunnel 2>&1 | head -22
          url=$(docker logs n8n-tunnel 2>&1 | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | head -n 1)
          echo "url tunnel: ${url:-tidak ada}"
          [ "$ready" = 1 ] && [ -n "$url" ] || { echo "tunnel/n8n tidak siap"; docker exec n8n-tunnel tail -20 /tmp/cloudflared.log; exit 1; }
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$url/healthz" | grep -q '"ok"'; then ok=1; break; fi
            sleep 3
          done
          docker stop -t 30 n8n-tunnel >/dev/null
          [ "$ok" = 1 ] || { echo "n8n tidak bisa dibuka lewat $url"; exit 1; }
          echo "HTTPS lewat tunnel OK"

      - name: Uji banner bahasa Inggris
        run: |
          IMAGE="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA::7}"
          out=$(docker run --rm -e CONSOLE_LANGUAGE=en -e SERVER_PORT=8124 -e N8N_SECURE_COOKIE=true "$IMAGE" true 2>&1)
          echo "$out"
          echo "$out" | grep -q 'Public URL' || { echo "banner English tidak muncul"; exit 1; }
          echo "$out" | grep -q 'Secure cookie = true' || { echo "peringatan cookie tidak muncul"; exit 1; }
